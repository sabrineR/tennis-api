name: Deploy production (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

concurrency:
  group: tennis-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy latest successful master
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://tennis-api.duckdns.org

    steps:
      - name: Require latest master and successful CI
        id: gate
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch' || context.ref !== 'refs/heads/master') {
              throw new Error('Only a manual dispatch on master may deploy.');
            }
            const { owner, repo } = context.repo;
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/master' });
            const sha = ref.object.sha;
            if (sha !== context.sha) {
              throw new Error('This dispatch is stale. Start a new run on the latest master.');
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'ci.yml', branch: 'master', event: 'push', head_sha: sha, per_page: 100,
            });
            const latest = runs.filter(run => run.head_sha === sha && run.head_branch === 'master')
              .sort((a, b) => b.id - a.id)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error('The latest push CI run for this exact master commit must be completed and successful.');
            }
            core.setOutput('sha', sha);
            core.info(`Approved commit ${sha}; CI run ${latest.id}.`);

      - name: Checkout approved commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Build and publish production image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DEPLOY_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --target production \
            --label "org.opencontainers.image.revision=$DEPLOY_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:sha-$DEPLOY_SHA" --push --metadata-file "$RUNNER_TEMP/image.json" .
          digest=$(jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/image.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Obtain temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
          role-session-name: tennis-api-cd-${{ github.run_id }}
          role-duration-seconds: 1800
          unset-current-credentials: true
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Recheck master and CI immediately before SSM
        uses: actions/github-script@v8
        env:
          APPROVED_SHA: ${{ steps.gate.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/master' });
            if (ref.object.sha !== process.env.APPROVED_SHA) {
              throw new Error('Master changed while waiting. Dispatch a new deployment.');
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'ci.yml', branch: 'master', event: 'push',
              head_sha: process.env.APPROVED_SHA, per_page: 100,
            });
            const latest = runs.filter(run => run.head_sha === process.env.APPROVED_SHA)
              .sort((a, b) => b.id - a.id)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error('CI is no longer successful for the approved commit.');
            }

      - name: Deploy through the approved SSM document and await completion
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.gate.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          DOCUMENT_HASH: ${{ vars.SSM_DEPLOY_DOCUMENT_SHA256 }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_PAGER: ''
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DOCUMENT_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          instance=i-066749c37a26e8556
          document="arn:aws:ssm:eu-west-3:$AWS_ACCOUNT_ID:document/TennisApiDeployProductionV1"
          parameters=$(jq -cn --arg sha "$DEPLOY_SHA" --arg digest "$IMAGE_DIGEST" \
            '{CommitSha:[$sha], ImageDigest:[$digest]}')
          command_id=$(aws ssm send-command --region eu-west-3 \
            --instance-ids "$instance" --document-name "$document" --document-version 1 \
            --document-hash "$DOCUMENT_HASH" --document-hash-type Sha256 \
            --parameters "$parameters" --timeout-seconds 60 \
            --cloud-watch-output-config CloudWatchOutputEnabled=false \
            --comment "Tennis API manual deployment $DEPLOY_SHA" \
            --query Command.CommandId --output text)
          [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]]
          echo "SSM command: $command_id"
          echo "SSM command: $command_id" >> "$GITHUB_STEP_SUMMARY"
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            if result=$(aws ssm get-command-invocation --region eu-west-3 \
              --command-id "$command_id" --instance-id "$instance" --plugin-name deploy \
              --query '{Status:Status,Code:ResponseCode}' --output json \
              2> "$RUNNER_TEMP/ssm-poll-error"); then
              status=$(jq -er .Status <<< "$result")
              case "$status" in
                Success)
                  [[ "$(jq -r .Code <<< "$result")" == 0 ]]
                  echo 'SSM deployment succeeded.'
                  exit 0
                  ;;
                Pending|InProgress|Delayed|Cancelling) ;;
                *) echo "SSM deployment did not succeed: $status" >&2; exit 1 ;;
              esac
            elif ! grep -q InvocationDoesNotExist "$RUNNER_TEMP/ssm-poll-error"; then
              echo 'Unable to follow SSM command. Inspect its ID before retrying; it may still be running.' >&2
              exit 1
            fi
            sleep 10
          done
          echo 'SSM wait timed out. Remote command may still run; inspect its ID before any retry.' >&2
          exit 1

      - name: Verify public HTTPS API (GET only)
        shell: bash
        run: |
          set -euo pipefail
          for resource in players stats; do
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --retry 10 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' \
              "https://tennis-api.duckdns.org/api/$resource" > "$RUNNER_TEMP/tennis-api-$resource.json"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const players = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/tennis-api-players.json`, 'utf8'));
          assert.ok(Array.isArray(players.players));
          for (const id of [17, 52, 65, 95, 102]) assert.ok(players.players.some(player => player.id === id));
          const stats = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/tennis-api-stats.json`, 'utf8'));
          for (const key of ['bestCountry', 'averageBmi', 'medianHeightCm']) assert.ok(key in stats);
          console.log('HTTPS players and statistics checks passed.');
          NODE

      - name: Deployment summary
        env:
          DEPLOY_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          printf 'Deployed commit %s to https://tennis-api.duckdns.org\n' "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
