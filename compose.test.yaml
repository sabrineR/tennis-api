name: tennis-api-test

services:
  db-test:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: tennis_test
      POSTGRES_USER: tennis_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env.test}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-25432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis_test -d tennis_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
